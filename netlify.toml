[build]
# Install dependencies with legacy-peer-deps and build the Angular app
command = "npm install --force --legacy-peer-deps && npm run build --configuration=production"

# The folder Netlify should serve
publish = "dist"
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
# Environment variables (no comments inside braces)
[build.environment]
NODE_VERSION = "22"
NPM_FLAGS = "--legacy-peer-deps"
